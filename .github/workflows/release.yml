# Builds both apps on every push/PR; on a version tag (v1.2.3) it also
# publishes a GitHub Release with the Windows .exe, the macOS .zip and
# SHA256SUMS.txt.
#
# Windows code signing (SignPath Foundation) switches on automatically once
# these are configured in the repo settings:
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG          (e.g. toxic-dota-save)
#   variable SIGNPATH_SIGNING_POLICY_SLUG   (e.g. release-signing)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh windows
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/ToxicDotaSave-Windows.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick signed binary when available
        run: |
          mkdir -p out
          if [ -f signed/ToxicDotaSave-Windows.exe ]; then
            cp signed/ToxicDotaSave-Windows.exe out/
          else
            cp dist/ToxicDotaSave-Windows.exe out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/ToxicDotaSave-Windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ToxicDotaSave-macOS.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum ToxicDotaSave-Windows.exe ToxicDotaSave-macOS.dmg | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ToxicDotaSave-Windows.exe
            release/ToxicDotaSave-macOS.dmg
            release/SHA256SUMS.txt
